---
layout: default
---
<article class="post-shell">
  <header class="page-hero">
    <p class="eyebrow">{{ page.categories | join: " / " | default: "Lab note" }}</p>

    <h1>{{ page.title }}</h1>

    <p class="page-intro">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  <div class="article-card prose">
    {{ content }}
  </div>

  <p class="back-link">
    <a class="text-link" href="{{ '/' | relative_url }}">Back to all notes</a>
  </p>
</article>
